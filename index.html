<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; connect-src 'none'; img-src data: blob:; media-src data: blob:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Обслуживание номеров — взаимодействие сотрудников</title>
  <style>
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: #193d35;
      font-family: Roboto, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
    }
    .controls {
      padding: 16px 24px;
      border-bottom: 1px solid #dfebe2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hint-text {
      font-size: 15px;
      color: #315346;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hint-text svg {
      width: 18px;
      height: 18px;
      fill: #48af45;
      flex-shrink: 0;
    }
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    button.btn {
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid #bdd1c3;
      border-radius: 9px;
      background: #ffffff;
      color: #234438;
      padding: 9px 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.1s;
    }
    button.btn:hover {
      background: #f2f7f4;
      border-color: #9cb8a5;
    }
    button.btn:active {
      transform: scale(0.98);
    }
    button.primary {
      background: #48af45;
      border-color: #48af45;
      color: #ffffff;
    }
    button.primary:hover {
      background: #3fa03c;
      border-color: #3fa03c;
    }
    button.btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    /* Игровая арена */
    .game-arena {
      position: relative;
      width: 100%;
      background: #ffffff;
      overflow: hidden;
      cursor: crosshair;
    }
    .scheme-img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }
    .dust-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      transition: opacity 0.5s ease;
      z-index: 2;
    }
    .dust-canvas.cleaned {
      pointer-events: none;
      opacity: 0;
    }

    /* Центральная подсказка на холсте */
    .center-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      border: 2px dashed #48af45;
      border-radius: 14px;
      padding: 14px 22px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
      pointer-events: none;
      z-index: 3;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .center-hint.fade {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.92);
    }
    .center-hint-title {
      font-size: 16px;
      font-weight: 600;
      color: #163e34;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .center-hint-desc {
      font-size: 13px;
      color: #557567;
      margin-top: 3px;
    }

    /* Курсор салфетки */
    .wiper-cursor {
      position: absolute;
      width: 48px;
      height: 48px;
      pointer-events: none;
      z-index: 4;
      transform: translate(-50%, -50%);
      transition: transform 0.05s ease-out;
      display: none;
    }
    .wiper-cursor.active {
      display: block;
    }
    .wiper-cursor svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.2));
    }

    /* Искорки чистоты */
    .sparkle {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      z-index: 5;
      animation: sparkle-anim 0.6s forwards ease-out;
    }
    @keyframes sparkle-anim {
      0% {
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.3) rotate(60deg);
        opacity: 0;
      }
    }

    @media (max-width: 680px) {
      .controls { padding: 12px 16px; }
      .hint-text { font-size: 13px; }
      button.btn { font-size: 13px; padding: 8px 14px; }
      .center-hint { padding: 10px 16px; }
      .center-hint-title { font-size: 14px; }
    }
  </style>
</head>

      <canvas class="dust-canvas" id="canvas"></canvas>

      <!-- Подсказка -->
      <div class="center-hint" id="center-hint">
        <div class="center-hint-title">
          <span>✨</span> Протри экран салфеткой
        </div>
        <div class="center-hint-desc">Зажми и води курсором или пальцем</div>
      </div>

      <!-- Курсор салфетки -->
      <div class="wiper-cursor" id="wiper">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="8" y="8" width="48" height="48" rx="12" fill="#FFD43F" stroke="#E5B218" stroke-width="3"/>
          <path d="M16 22H48M16 32H48M16 42H48" stroke="#FFE785" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
          <path d="M48 10L51 16L57 19L51 22L48 28L45 22L39 19L45 16Z" fill="#FFFFFF"/>
          <circle cx="20" cy="46" r="3" fill="#FFFFFF" opacity="0.8"/>
        </svg>
      </div>
    </div>
  </main>

  <script>
    const arena = document.getElementById('arena');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const schemeImg = document.getElementById('scheme-img');
    const centerHint = document.getElementById('center-hint');
    const wiper = document.getElementById('wiper');
    const btnReveal = document.getElementById('btn-reveal');
    const btnReset = document.getElementById('btn-reset');

    const brushRadius = 65; // удобный универсальный размер салфетки
    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let isCleaned = false;
    let checkThrottleTimeout = null;

    function resizeCanvas() {
      const rect = arena.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      renderDust();
    }

    function renderDust() {
      const w = arena.clientWidth;
      const h = arena.clientHeight;
      if (!w || !h) return;

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';

      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, 'rgba(215, 219, 216, 0.94)');
      grad.addColorStop(0.5, 'rgba(228, 232, 229, 0.96)');
      grad.addColorStop(1, 'rgba(210, 215, 212, 0.94)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 45; i++) {
        const rx = (Math.sin(i * 99) * 0.5 + 0.5) * w;
        const ry = (Math.cos(i * 33) * 0.5 + 0.5) * h;
        const rad = 40 + (i % 7) * 25;
        const spotGrad = ctx.createRadialGradient(rx, ry, 5, rx, ry, rad);
        spotGrad.addColorStop(0, 'rgba(200, 205, 202, 0.35)');
        spotGrad.addColorStop(1, 'rgba(200, 205, 202, 0)');
        ctx.fillStyle = spotGrad;
        ctx.beginPath();
        ctx.arc(rx, ry, rad, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      for (let j = 0; j < 120; j++) {
        const px = (Math.sin(j * 43) * 0.5 + 0.5) * w;
        const py = (Math.cos(j * 71) * 0.5 + 0.5) * h;
        ctx.fillRect(px, py, 2, 2);
      }

      ctx.restore();
    }

    function wipe(x, y) {
      if (isCleaned) return;

      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';

      ctx.beginPath();
      ctx.arc(x, y, brushRadius, 0, Math.PI * 2);
      ctx.fill();

      if (lastX && lastY) {
        ctx.lineWidth = brushRadius * 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
      ctx.restore();

      lastX = x;
      lastY = y;

      if (Math.random() < 0.3) {
        createSparkle(x, y);
      }

      if (!centerHint.classList.contains('fade')) {
        centerHint.classList.add('fade');
      }

      if (!checkThrottleTimeout) {
        checkThrottleTimeout = setTimeout(() => {
          checkProgress();
          checkThrottleTimeout = null;
        }, 200);
      }
    }

    function checkProgress() {
      if (isCleaned) return;

      const dpr = window.devicePixelRatio || 1;
      const w = Math.floor(canvas.width);
      const h = Math.floor(canvas.height);
      const sampleStep = 28 * Math.round(dpr);

      try {
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        let totalSamples = 0;
        let cleanSamples = 0;

        for (let y = 0; y < h; y += sampleStep) {
          for (let x = 0; x < w; x += sampleStep) {
            const index = (y * w + x) * 4;
            const alpha = data[index + 3];
            totalSamples++;
            if (alpha < 60) cleanSamples++;
          }
        }

        const percent = Math.round((cleanSamples / totalSamples) * 100);
        // Если протерли более 75% — остаток плавно растворяется и экран остается чистым
        if (percent >= 75) {
          finishCleaning();
        }
      } catch (e) {}
    }

    function createSparkle(x, y) {
      const spark = document.createElement('div');
      spark.className = 'sparkle';
      spark.style.left = (x + (Math.random() * 26 - 13)) + 'px';
      spark.style.top = (y + (Math.random() * 26 - 13)) + 'px';
      spark.innerHTML = `<svg viewBox="0 0 24 24" fill="#48af45"><path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z"/></svg>`;
      arena.appendChild(spark);
      setTimeout(() => spark.remove(), 600);
    }

    // Завершение: экран очищается и просто остается чистым (без модальных окон)
    function finishCleaning() {
      if (isCleaned) return;
      isCleaned = true;
      canvas.classList.add('cleaned');
      centerHint.classList.add('fade');
      wiper.classList.remove('active');
    }

    // Сброс в начало (снова запылить)
    function resetCleaning() {
      isCleaned = false;
      canvas.classList.remove('cleaned');
      centerHint.classList.remove('fade');
      renderDust();
    }

    function getCoords(e) {
      const rect = arena.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    arena.addEventListener('pointerdown', e => {
      if (isCleaned) return;
      isDrawing = true;
      const c = getCoords(e);
      lastX = c.x;
      lastY = c.y;
      wipe(c.x, c.y);
      wiper.style.left = c.x + 'px';
      wiper.style.top = c.y + 'px';
      wiper.classList.add('active');
    });

    window.addEventListener('pointermove', e => {
      const rect = arena.getBoundingClientRect();
      const inArena = (
        e.clientX >= rect.left &&
        e.clientX <= rect.right &&
        e.clientY >= rect.top &&
        e.clientY <= rect.bottom
      );

      if (inArena && !isCleaned) {
        const c = getCoords(e);
        wiper.style.left = c.x + 'px';
        wiper.style.top = c.y + 'px';
        wiper.classList.add('active');

        if (isDrawing) {
          wipe(c.x, c.y);
        }
      } else {
        wiper.classList.remove('active');
      }
    });

    window.addEventListener('pointerup', () => {
      isDrawing = false;
      lastX = 0;
      lastY = 0;
    });

    window.addEventListener('pointercancel', () => {
      isDrawing = false;
      lastX = 0;
      lastY = 0;
      wiper.classList.remove('active');
    });

    btnReveal.onclick = finishCleaning;
    btnReset.onclick = resetCleaning;

    if (schemeImg.complete) {
      resizeCanvas();
    } else {
      schemeImg.onload = resizeCanvas;
    }
    window.addEventListener('resize', resizeCanvas);
  </script>
